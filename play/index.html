<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7ec0ee">
<title>Chuga Chocho — Play</title>
<!-- Inline favicon: a browser asks for /favicon.ico otherwise, and over http
     that is a 404 in the console for no reason. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%9A%82%3C/text%3E%3C/svg%3E">
<!-- ?v= is a cache-buster. GitHub Pages and browsers cache these hard, so a
     release can otherwise leave a returning visitor on the OLD game with a
     stale index.html that never even requests a newly added file. BUMP THIS
     NUMBER on every deploy — it is the whole release process for a site with
     no build step. -->
<link rel="stylesheet" href="css/styles.css?v=54">
</head>
<body>
  <div id="wrap">
    <!-- Every location scene is mounted in here, sized by its own viewBox. -->
    <div id="stage"></div>

    <div id="title">🚂 Chuga Chocho!</div>

    <!-- How many cars have crossed. Hidden from the settings panel. -->
    <div id="counter" hidden>🚗 0</div>

    <div id="topbar">
      <button id="mapBtn"   class="icon" data-i18n-title="map">🗺️</button>
      <button id="trainBtn" class="icon" data-i18n-title="train">🚆</button>
      <button id="gearBtn"  class="icon" data-i18n-title="settings">⚙️</button>
    </div>

    <!-- The two gate controls. They stay on top of every screen on purpose:
         the gate is never unavailable, whatever else is open. -->
    <div id="controls">
      <button class="big" id="closeBtn"><span class="ico">⬇️</span><span class="lbl" data-i18n="close">CLOSE</span></button>
      <button class="big" id="openBtn"><span class="ico">⬆️</span><span class="lbl" data-i18n="open">OPEN</span></button>
    </div>

    <!-- Settings. The map and the train customizer build their own overlays. -->
    <div id="panel" hidden></div>

    <!-- Held upright? The scenes are 16:9 storybook art, so a portrait screen crops
         three quarters of every place away — you keep the road and the crossing,
         which look the same everywhere, and lose everything that makes a place that
         place. Turned sideways a phone shows MORE of a scene than a laptop does
         (100% of the width against 90%), so this asks rather than compromises.
         Driven by a pure CSS media query, so it appears and clears the instant the
         device turns, with no resize handler to get out of step. -->
    <div id="rotate" aria-hidden="true">
      <svg class="rot-icon" viewBox="0 0 120 120" aria-hidden="true">
        <g class="rot-dev">
          <rect x="38" y="14" width="44" height="86" rx="9" fill="#ffffff"/>
          <rect x="43" y="22" width="34" height="66" rx="3" fill="#2a6fd6"/>
          <circle cx="60" cy="94" r="3.5" fill="#c9ccd1"/>
        </g>
        <g stroke="#ffd166" stroke-width="7" stroke-linecap="round" fill="none">
          <path d="M22,80 a42,42 0 0 0 76,0"/>
          <path d="M98,80 l-10,-10 M98,80 l-13,3"/>
        </g>
      </svg>
      <div class="rot-text" data-i18n="rotate"></div>
    </div>
  </div>

  <!-- Classic scripts (no ES modules) so the game runs by opening this file
       directly. Load order: data, then services, then systems, then the
       orchestrator. asset-data.js must come before anything that draws. -->
  <script src="js/i18n.js?v=54"></script>
  <script src="js/speech.js?v=54"></script>
  <script src="js/audio.js?v=54"></script>
  <script src="js/asset-data.js?v=54"></script>
  <script src="js/rolling.js?v=54"></script>
  <script src="js/trains.js?v=54"></script>
  <script src="js/gate.js?v=54"></script>
  <script src="js/world.js?v=54"></script>
  <script src="js/map-data.js?v=54"></script>
  <script src="js/map.js?v=54"></script>
  <script src="js/scene.js?v=54"></script>
  <script src="js/customizer.js?v=54"></script>
  <script src="js/welcome.js?v=54"></script>
  <script src="js/modes.js?v=54"></script>
  <script src="js/settings.js?v=54"></script>
  <script src="js/main.js?v=54"></script>
</body>
</html>
